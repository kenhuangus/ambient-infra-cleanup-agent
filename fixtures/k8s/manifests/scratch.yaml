apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch
  namespace: dev
  labels:
    app: scratch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scratch
  template:
    metadata:
      labels:
        app: scratch
    spec:
      containers:
        - name: scratch
          image: example/scratch:0.1.0
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 200m
              memory: 512Mi
